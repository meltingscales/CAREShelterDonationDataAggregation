[package]
name = "care-shelter-donation-aggregation"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "print-donorsnap-field-names"
path = "src/print-donorsnap-field-names.rs"

[[bin]]
name = "map-fields"
path = "src/map-fields.rs"

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
calamine = "0.24"
csv = "1.3"
serde_json = "1.0"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "limit", "request-id"] }
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.8"
askama = "0.12"
askama_axum = "0.4"
uuid = { version = "1.0", features = ["v4"] }
utoipa = { version = "5.3", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum", "vendored"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = "1.10"
bytes = "1.5"
rust_xlsxwriter = "0.81"